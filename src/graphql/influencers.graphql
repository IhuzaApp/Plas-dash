          OrderID
          assigned_at
          combined_order_id
          created_at
          delivery_address_id
          delivery_fee
          delivery_notes
          delivery_photo_url
          delivery_time
          discount
          found
          id
          pin
          restaurant_id
          shopper_id
          status
          total
          updated_at
          user_id
          voucher_code
        }
        reel_order {
          OrderID
          assigned_at
          combined_order_id
          created_at
          delivery_address_id
          delivery_fee
          delivery_note
          delivery_photo_url
          delivery_time
          discount
          found
          id
          pin
          quantity
          reel_id
          service_fee
          shopper_id
          status
          total
          updated_at
          user_id
          voucher_code
        }
      }
      Shop {
        address
        category_id
        created_at
        description
      }
    }
    payment_method
    influencer_commissions {
      amount
      commission_type
      created_at
      id
      influencer_id
      order_threshold
    }
    influencer_earnings {
      created_at
      earning_amount
      id
      promotion_id
      influencer_id
      reel_order_id
      restaurant_order_id
      shop_order_id
      status
      updated_at
    }
  }
}
