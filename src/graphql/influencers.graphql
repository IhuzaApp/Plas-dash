query getInfluencerDetails {
  influencers {
    updated_at
    status
    phone
    payment_terms
    name
    momo_number
    membershipId
    id
    email
    description
    created_at
    contract_start_date
    contract_end_date
    bank_name
    bank_account_number
    bank_account_name
    promotions {
      applies_to_id
      applies_to_type
      buy_quantity
      code
      created_at
      discount_type
      discount_value
      earning_per_order
      end_date
      end_time
      id
      influencer_code
      is_stackable
      min_purchase_amount
      influencer_id
      name
      priority
      promotion_type
      restaurant_id
      shop_id
      start_date
      start_time
      status
      update_on
      usage_limit
      usage_per_customer
      influencer {
        bank_account_name
        bank_account_number
        bank_name
        contract_end_date
        contract_start_date
        created_at
        description
        email
        id
        membershipId
        momo_number
        name
        payment_method
        payment_terms
        phone
        status
        updated_at
      }
      influencer_earnings {
        created_at
        earning_amount
        id
        influencer_id
        promotion_id
        reel_order_id
        restaurant_order_id
        shop_order_id
        status
        updated_at
